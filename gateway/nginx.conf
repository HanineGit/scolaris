# Passerelle API (F14) : seul composant exposé à Internet.
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;                      # version de Nginx non divulguée
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Journal d'accès sans chaîne de requête (pas de matricule ni de jeton dans les journaux).
    log_format sobre '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time $upstream_response_time';
    access_log /dev/stdout sobre;
    error_log  /dev/stderr warn;

    # Limitation de débit (R01, R11, R27).
    limit_req_zone $binary_remote_addr zone=connexion:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m      rate=1200r/m;
    # Limite par compte (US27) : la clé est l'en-tête Authorization, propre à chaque session.
    limit_req_zone $http_authorization zone=compte:10m   rate=300r/m;
    # Vérification publique des relevés : peu de requêtes légitimes, on freine l'énumération des codes.
    limit_req_zone $binary_remote_addr zone=verification:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    client_max_body_size 1m;                # requêtes de 1 Mo au plus
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_hide_header X-Powered-By;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    upstream auth      { server auth:8000; }
    upstream etudiants { server etudiants:8000; }
    upstream notes     { server notes:8000; }
    upstream audit     { server audit:8000; }
    upstream notifications { server notifications:8000; }

    # HTTP est systématiquement redirigé vers HTTPS.
    server {
        listen 8080;
        return 301 https://$host:9443$request_uri;   # port publié sur le poste
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.3;              # TLS 1.3 uniquement
        ssl_session_tickets off;

        limit_conn conn 50;

        # En-têtes de sécurité, sur toutes les réponses.
        include /etc/nginx/entetes_securite.conf;

        # Aucune en-tête CORS n'est émise : seules les pages servies par ce domaine
        # (back-office) et l'application mobile (non soumise à CORS) appellent l'API.

        # Routes internes : jamais accessibles depuis l'extérieur.
        location /internal { return 404; }
        location = /sante  { return 404; }

        location = /api/v1/auth/connexion {
            limit_req zone=connexion burst=3 nodelay;
            proxy_pass http://auth;
        }
        location = /api/v1/auth/mfa/verifier {
            limit_req zone=connexion burst=3 nodelay;
            proxy_pass http://auth;
        }
        location /api/v1/auth/          { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://auth; }
        location /api/v1/admin/comptes  { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://auth; }
        location /api/v1/admin/securite { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://auth; }
        location /api/v1/moi/           { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://auth; }

        # La consultation mobile relève du service Notes ; le reste de /etudiants du service Étudiants.
        location /api/v1/etudiants/moi/ { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://notes; }
        location /api/v1/etudiants      { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://etudiants; }
        # Classes : service Étudiants, sauf la délibération qui relève du service Notes.
        location ~ ^/api/v1/classes/[0-9a-f\-]+/deliberation$ { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://notes; }
        location /api/v1/classes        { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://etudiants; }

        location /api/v1/matieres       { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://notes; }
        location /api/v1/notes          { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://notes; }
        location /api/v1/enseignants/   { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://notes; }
        location /api/v1/semestres      { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://notes; }
        location /api/v1/reclamations   { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://notes; }
        location /api/v1/verification/  { limit_req zone=verification burst=5 nodelay; proxy_pass http://notes; }

        location /api/v1/notifications  { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://notifications; }

        location /api/v1/audit/         { limit_req zone=api burst=100 nodelay; limit_req zone=compte burst=20 nodelay; proxy_pass http://audit; }

        location /api/ { return 404; }

        # Back-office web (fichiers statiques construits par Vite).
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/entetes_securite.conf;
        }
    }
}
