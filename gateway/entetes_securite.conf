# En-têtes de sécurité, définis une seule fois et inclus partout : dans Nginx, un add_header
# placé dans une location annule ceux hérités du bloc server (cause d'un oubli relevé par ZAP).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Polices et feuilles de style servies par la passerelle elle-même : ni 'unsafe-inline' ni domaine externe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
