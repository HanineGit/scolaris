# Règles de l'analyse dynamique OWASP ZAP (zap-baseline.py -c regles-zap.conf).
# Format : identifiant<TAB>action<TAB>(justification)
# Actions : FAIL bloque le pipeline, WARN signale sans bloquer, IGNORE écarte une fausse alerte justifiée.
# Toute règle absente de ce fichier est traitée en WARN, puis scripts/verifier_zap.py
# fait échouer le pipeline dès qu'une alerte de risque moyen ou élevé subsiste.
10010	FAIL	(Cookie sans HttpOnly)
10011	FAIL	(Cookie sans Secure)
10020	FAIL	(Protection contre le clickjacking absente)
10021	FAIL	(X-Content-Type-Options absent)
10035	FAIL	(HSTS absent)
10036	FAIL	(Version du serveur divulguée)
10038	FAIL	(CSP absente)
10054	FAIL	(Cookie sans SameSite)
10055	FAIL	(CSP trop permissive)
10062	FAIL	(Données personnelles exposées)
10098	FAIL	(CORS trop ouvert)
10202	FAIL	(Formulaire sans protection CSRF)
90022	FAIL	(Message d'erreur applicatif divulgué)
10049	IGNORE	(Contenu non mis en cache : comportement voulu, Cache-Control no-store sur l'API)
10109	IGNORE	(Empreinte d'outils modernes : information sans risque)
10116	IGNORE	(ZAP signale sa propre version : la version est figée volontairement dans le pipeline et mise à jour par une modification contrôlée)
