[project]
name = "scolaris-common"
version = "0.1.0"
description = "Briques de sécurité partagées par les microservices Scolaris"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy>=2.0.35",
    "pika>=1.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scolaris_common*"]
