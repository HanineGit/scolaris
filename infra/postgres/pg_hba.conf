# Règles d'accès à PostgreSQL (moindre privilège, chiffrement obligatoire).
# TYPE      BASE   UTILISATEUR   ADRESSE      MÉTHODE

# Socket local du conteneur : réservé à l'administrateur (initialisation, contrôle de santé, sauvegarde).
local       all    postgres                   peer

# Réseau : TLS obligatoire et mot de passe SCRAM-SHA-256.
hostssl     all    all           0.0.0.0/0    scram-sha-256
hostssl     all    all           ::/0         scram-sha-256

# Toute connexion non chiffrée est refusée.
hostnossl   all    all           0.0.0.0/0    reject
hostnossl   all    all           ::/0         reject
